<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Laborführerschein Chemie 8</title>
<style>
/* Layout: einspaltige Prüfstrecke. Oben eine feste Leiste mit fünf Stempelfeldern,
   darunter immer genau eine Aufgabe. Farben folgen den Sicherheitszeichen im Labor:
   Blau = Gebot, Grün = sicher, Rot = Gefahr, Gelb = Warnung. Keine externen Dateien. */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface-2:#F2F5F8; --ink:#12202B; --muted:#4D5F6C; --line:#C6D2DB;
  --blue:#005A96; --on-blue:#FFFFFF; --blue-soft:#DAE9F5;
  --ok:#0B7541; --ok-soft:#DBF1E4; --bad:#BF141B; --bad-soft:#FBE0E0;
  --warn:#EDAE00; --warn-soft:#FFF1C7; --warn-ink:#5A4200;
  --glass:#DCEAF5; --liquid:#8CC4EC; --flame-out:#8DBCEB; --flame-in:#E3F2FF;
  --lic-bg:#F3D2DC; --lic-ink:#3A1E2A; --lic-line:#D49DB1; --stamp:#1C4FA3;
  --f-display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#172129; --surface-2:#1F2B35; --ink:#E7EEF3; --muted:#9DB0BD; --line:#32424F;
    --blue:#5BB0EA; --on-blue:#06202F; --blue-soft:#15344A;
    --ok:#4CC98A; --ok-soft:#123425; --bad:#FF7376; --bad-soft:#431A1C;
    --warn:#F5C542; --warn-soft:#3A2F0C; --warn-ink:#F5D675;
    --glass:#1D3748; --liquid:#2F78AE; --flame-out:#2C68A6; --flame-in:#9BD0FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#172129; --surface-2:#1F2B35; --ink:#E7EEF3; --muted:#9DB0BD; --line:#32424F;
  --blue:#5BB0EA; --on-blue:#06202F; --blue-soft:#15344A;
  --ok:#4CC98A; --ok-soft:#123425; --bad:#FF7376; --bad-soft:#431A1C;
  --warn:#F5C542; --warn-soft:#3A2F0C; --warn-ink:#F5D675;
  --glass:#1D3748; --liquid:#2F78AE; --flame-out:#2C68A6; --flame-in:#9BD0FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:44rem;margin-inline:auto;padding-inline:16px;padding-block:0 40px}

/* Leiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;border-bottom:2px solid var(--ink)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;
  background:none;border:0;padding:4px 0;margin-right:auto}
.track{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.track li{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--muted);background:var(--surface)}
.track li.now{border-color:var(--blue);color:var(--blue)}
.track li.done{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.track li.open{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.score{font-family:var(--f-mono);font-size:.85rem;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.score b{font-size:1rem}
.serie{padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.serie.hot{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink);font-weight:700}

main{display:flex;flex-direction:column;gap:18px;padding-top:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(1.5rem,6.6vw,3rem);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
h2{font-size:1.55rem}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:60ch}
.small{font-size:.85rem;color:var(--muted)}

.btn{min-height:48px;padding:10px 20px;border-radius:var(--r);border:2px solid var(--blue);background:var(--blue);
  color:var(--on-blue);font-weight:700}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:6px 0;color:var(--blue);text-decoration:underline;text-underline-offset:3px}

/* Start */
.field{display:flex;flex-direction:column;gap:6px;max-width:22rem}
.field label{font-weight:600}
.field input{min-height:48px;padding:8px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stations{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.stations button{width:100%;display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px}
.stations button:hover{background:var(--surface)}
.stations .nr{font-family:var(--f-mono);font-weight:700;font-size:1.3rem;color:var(--blue)}
.stations .tt{font-family:var(--f-display);font-weight:700;font-size:1.2rem;display:block}
.stations .can{font-size:.88rem;color:var(--muted);display:block}
.stations .txt{min-width:0}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.star-on{fill:var(--warn);stroke:var(--warn-ink);stroke-width:1}
.star-off{fill:none;stroke:var(--line);stroke-width:1.5}

/* Aufgabe */
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.dots{display:flex;gap:5px}
.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.dots i.d{background:var(--blue)}
.dots i.c{background:var(--ink)}
.q{font-size:1.4rem}
.sub{color:var(--muted)}
.media{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.media:empty{display:none}
.media svg.fig{width:100%;max-width:300px;height:auto}
.media .dev{width:150px;height:150px}
.media .ghs{width:150px;height:150px}
.label-mock{border:2px solid var(--ink);border-radius:6px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.label-mock .ghs{width:84px;height:84px}
.label-mock p{font-size:.9rem;min-width:0}

.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:repeat(2,1fr)}
.opt{min-height:52px;text-align:left;padding:12px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:12px}
.opts.grid .opt{flex-direction:column;justify-content:center;text-align:center}
.opt .dev{width:96px;height:96px}
.opt .ghs{width:104px;height:104px}
.opt.ico .dev{width:58px;height:58px;padding:4px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default;color:var(--ink);opacity:1}
.tag{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;font-weight:700;white-space:nowrap}
.opt.ok .tag,.rowj.ok .tag{color:var(--ok)} .opt.bad .tag,.rowj.bad .tag{color:var(--bad)} .opt.miss .tag{color:var(--ok)}
.cap{font-size:.85rem;font-weight:600}

img.ghs{display:block;flex:none;max-width:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.opt b{flex:none;white-space:nowrap}
.dev{display:block;flex:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow:hidden}
.dev img{display:block;width:100%;height:100%;max-width:none;object-fit:contain}

/* Schnellcheck */
.card-j{border:2px solid var(--ink);border-radius:var(--r);padding:18px;background:var(--surface-2);font-size:1.1rem;font-weight:600;min-height:5.5rem;display:flex;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn.safe{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.two .btn.risk{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.log{display:flex;flex-direction:column;gap:8px}
.rowj{border-left:4px solid var(--line);padding:6px 10px;font-size:.9rem;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.rowj.ok{border-color:var(--ok)} .rowj.bad{border-color:var(--bad)}
.rowj .rule{grid-column:1/-1;color:var(--muted)}

/* Lücken */
.gaptext{font-size:1.1rem;line-height:2.3}
.gap{margin-inline:5px;min-width:5.5rem;min-height:36px;padding:2px 10px;border:0;border-bottom:3px solid var(--blue);background:var(--blue-soft);border-radius:6px 6px 0 0;font-weight:700;vertical-align:baseline}
.gap.next{outline:2px dashed var(--blue);outline-offset:2px}
.gap.ok{background:var(--ok-soft);border-color:var(--ok)} .gap.bad{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through}
.fix{font-weight:700;color:var(--ok);margin-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface-2);font-weight:600}
.chip:disabled{opacity:.3}

/* Reihenfolge */
.ord{display:flex;flex-direction:column;gap:8px}
.ord button{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;align-items:center;text-align:left;min-height:52px;padding:10px 12px;
  border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.ord .n{width:2rem;height:2rem;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700}
.ord button.set{border-color:var(--blue)} .ord button.set .n{border:2px solid var(--blue);background:var(--blue);color:var(--on-blue)}
.ord button.ok{border-color:var(--ok);background:var(--ok-soft)} .ord button.ok .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ord button.bad{border-color:var(--bad);background:var(--bad-soft)} .ord button.bad .n{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.ord button:disabled{color:var(--ink);opacity:1;cursor:default}

/* Paare */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px 14px}
.match>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.m{min-height:56px;padding:6px 10px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.m .dev{width:66px;height:66px;padding:4px} .m .ghs{width:60px;height:60px}
.match>div>.m{flex:1}
.m.num{font-family:var(--f-mono);font-size:1.2rem}
.m[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.m.ok{border-color:var(--ok);background:var(--ok-soft)} .m.bad{border-color:var(--bad);background:var(--bad-soft)}
.m:disabled{opacity:1;color:var(--ink);cursor:default}

/* Zwei Töpfe */
.sort2{display:flex;flex-direction:column;gap:8px}
.s2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.s2 span{min-width:0}
.seg{display:flex}
.seg button{min-height:44px;padding:4px 10px;border:2px solid var(--line);background:var(--surface-2);font-size:.85rem;font-weight:700}
.seg button:first-child{border-radius:var(--r) 0 0 var(--r);border-right-width:1px}
.seg button:last-child{border-radius:0 var(--r) var(--r) 0;border-left-width:1px}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.s2.ok{color:var(--ok)} .s2.bad{color:var(--bad)}
.seg button:disabled{cursor:default}

/* Zahl */
.num{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num input{width:8rem;min-height:48px;padding:8px 12px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2);font-family:var(--f-mono);font-size:1.2rem;text-align:right}
.num .unit{font-family:var(--f-mono);font-weight:700}

/* Grafiken */
.fig text{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}
.fig .st{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .gl{fill:var(--glass);stroke:var(--ink);stroke-width:2}
.fig .lq{fill:var(--liquid);stroke:none}
.fig .mt{fill:var(--muted);stroke:var(--ink);stroke-width:2}
.fig .dash{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.spot{cursor:pointer}
.spot .sb{fill:var(--surface);stroke:var(--blue);stroke-width:2.5}
.spot text{font-weight:700;font-size:14px;text-anchor:middle;dominant-baseline:central}
.spot:hover .sb{fill:var(--blue-soft)}
.spot.ok .sb{fill:var(--ok-soft);stroke:var(--ok);stroke-width:4}
.spot.bad .sb{fill:var(--bad-soft);stroke:var(--bad);stroke-width:4}
.spot.off{cursor:default}
.mk circle{fill:var(--ink)} .mk text{fill:var(--surface);font-weight:700;text-anchor:middle;dominant-baseline:central}

/* Rückmeldung */
.tipbox{border-left:4px solid var(--warn);background:var(--warn-soft);color:var(--warn-ink);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.95rem}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--line)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)} .fb.part{border-color:var(--warn);background:var(--warn-soft)} .fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{font-size:1.2rem}
.fb .pts{font-family:var(--f-mono);font-size:.85rem;font-weight:700}

/* Stationsende und Führerschein */
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.big{font-family:var(--f-mono);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.result .stars svg{width:34px;height:34px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;
  border:4px double var(--stamp);color:var(--stamp);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;
  transform:rotate(-9deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}
.stamp strong{font-size:1.15rem;border-block:2px solid var(--stamp);padding:2px 6px;margin:4px 0}
.stamp.none{border-style:dashed;border-color:var(--line);color:var(--muted);animation:none;transform:none}
@keyframes stamp{from{transform:rotate(-9deg) scale(1.6);opacity:.35}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}}

.lic{background:var(--lic-bg);color:var(--lic-ink);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;
  border:2px solid var(--lic-line);
  background-image:repeating-linear-gradient(115deg,transparent 0 9px,rgba(255,255,255,.28) 9px 10px),repeating-linear-gradient(25deg,transparent 0 13px,rgba(255,255,255,.2) 13px 14px)}
.lic header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--lic-ink);padding-bottom:8px}
.lic h2{font-size:clamp(1.5rem,6.5vw,2.2rem);text-transform:uppercase;letter-spacing:.05em}
.lic .cls{font-family:var(--f-mono);font-size:.8rem}
.lic dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.95rem}
.lic dt{font-family:var(--f-mono);font-size:.75rem;opacity:.75;align-self:center}
.lic dd{margin:0;font-weight:700;overflow-wrap:anywhere;min-width:0}
.lic table{width:100%;border-collapse:collapse;font-size:.9rem}
.lic th,.lic td{border:1px solid var(--lic-line);padding:6px;text-align:left}
.lic .stars svg{width:14px;height:14px}
.lic td b{font-family:var(--f-mono);margin-right:6px}
.lic td:first-child{overflow-wrap:anywhere;hyphens:auto}
.lic th{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.lic td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lic .okm{color:var(--stamp);font-family:var(--f-mono);font-weight:700;font-size:.7rem;text-transform:uppercase;border:2px solid var(--stamp);border-radius:4px;padding:1px 5px;display:inline-block;transform:rotate(-4deg)}
.lic .nom{font-family:var(--f-mono);font-size:.75rem;opacity:.7}
.lic .star-on{fill:#D99A00;stroke:#6B4A00} .lic .star-off{stroke:var(--lic-line)}
.lic .verdict{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em}
.lic .fine{font-size:.78rem;opacity:.85}
.lic .wm{align-self:flex-end;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;opacity:.5}
.tablewrap{overflow-x:auto}
.pngout{display:flex;flex-direction:column;gap:8px}
.pngout:empty{display:none}
.pngprev{display:block;width:100%;max-width:560px;height:auto;border:1px solid var(--line);border-radius:8px}
@media (max-width:420px){.q{font-size:1.25rem}.task{padding:16px}.lic{padding:18px 14px}.opt .ghs{width:96px;height:96px}}
</style>

<div class="app" lang="de">
  <div class="bar">
    <button class="brand" id="home" type="button">Laborführerschein</button>
    <ol class="track" id="track" aria-label="Stationen"></ol>
    <div class="score"><span><b id="pts">0</b> Punkte</span><span class="serie" id="serie">Serie 0</span></div>
  </div>
  <main id="view"></main>
</div>

<script>
"use strict";

function figMeniskus(v){

}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const pick = (a,n) => shuffle(a).slice(0,n);
function stars(n){ let s = '<span class="stars" role="img" aria-label="'+n+' von 3 Sternen">'; for(let i=1;i<=3;i++) s += '<svg viewBox="0 0 24 24" class="'+(i<=n?'star-on':'star-off')+'"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>'; return s+'</span>'; }

/* ---------- Zustand ---------- */
const KEY = 'laborfuehrerschein-v2', N = STATIONS.length;
const S = { name:'', results:STATIONS.map(()=>null), attempt:1, runs:0, prog:null, si:-1, ti:0, tasks:[], cur:null, streak:0, tip:false };
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)||'null'); if(d && Array.isArray(d.results) && d.results.length===N){
  S.results = d.results; S.name = d.name||''; S.attempt = d.attempt>0 ? d.attempt : 1; S.runs = d.runs>=0 ? d.runs : d.results.filter(Boolean).length;
  S.streak = d.streak||0; S.prog = d.prog||null; } }catch(e){} }
/* Speichert alles im Browser: Name, Ergebnisse, Versuchszähler und die laufende Station samt Aufgabennummer. */
function save(ti){ try{
  const prog = S.cur ? {si:S.si, ti:(ti===undefined ? S.ti : ti), base:S.cur.base, pts:S.cur.pts, el:Date.now()-S.cur.t0} : null;
  localStorage.setItem(KEY, JSON.stringify({name:S.name, results:S.results, attempt:S.attempt, runs:S.runs, streak:S.streak, prog})); }catch(e){} }
function resume(){ const p = S.prog; S.prog = null;
  if(!p || !(p.si>=0 && p.si<N)) return false;
  S.si = p.si; S.tasks = STATIONS[p.si].build(); S.ti = Math.max(0, Math.min(p.ti||0, S.tasks.length));
  S.cur = {base:p.base||0, pts:p.pts||0, t0:Date.now()-(p.el||0)};
  S.ti < S.tasks.length ? showTask() : endStation(); return true; }
const hasStamp = i => !!(S.results[i] && S.results[i].pct >= 60);
const starsFor = p => p>=90?3 : p>=75?2 : p>=60?1 : 0;
function nextOpen(from){ for(let k=1;k<=N;k++){ const i=(from+k)%N; if(!hasStamp(i)) return i; } return -1; }

const view = $('#view');
function header(){
  $('#track').innerHTML = STATIONS.map((s,i)=>{
    const c = hasStamp(i)?'done' : (i===S.si?'now' : (S.results[i]?'open':''));
    return '<li class="'+c+'" title="Station '+(i+1)+': '+esc(s.title)+'">'+(i+1)+'</li>'; }).join('');
  let p = 0; S.results.forEach((r,i)=>{ if(r && !(S.cur && i===S.si)) p += r.pts; }); if(S.cur) p += S.cur.pts;
  $('#pts').textContent = p;
  const se = $('#serie'); se.textContent = 'Serie '+S.streak; se.classList.toggle('hot', S.streak>=3);
}
function show(html){ view.innerHTML = html; header(); window.scrollTo(0,0); }

/* ---------- Start ---------- */
function home(){
  S.si = -1; S.cur = null; save();
  const done = S.results.filter((r,i)=>hasStamp(i)).length, any = S.results.some(Boolean), first = nextOpen(N-1);
  const label = first<0 ? 'Führerschein ansehen' : (any ? 'Weiter mit Station '+(first+1) : 'Prüfung starten');
  show('<div><p class="eyebrow">Chemie · 8. Jahrgangsstufe NTG</p><h1>Laborführerschein</h1></div>'
   +'<p class="lead">Vier Stationen, 18 Aufgaben, etwa 8 bis 10 Minuten. Für jede Station mit mindestens 60 % gibt es einen Stempel. Mit vier Stempeln ist dein Führerschein vollständig.</p>'
   +'<div class="field"><label for="name">Dein Vorname</label><input id="name" type="text" maxlength="24" autocomplete="off" placeholder="steht später auf dem Führerschein"><span class="small">Name und Fortschritt bleiben in diesem Browser gespeichert.</span></div>'
   +'<div class="row"><button class="btn" id="go" type="button">'+label+'</button><span class="small">'+done+' von '+N+' Stempeln</span></div>'
   +'<ol class="stations">'+STATIONS.map((s,i)=>{ const r = S.results[i];
      return '<li><button type="button" data-s="'+i+'"><span class="nr">'+(i+1)+'</span><span class="txt"><span class="tt">'+esc(s.title)+'</span><span class="can">'+esc(s.can)+'</span></span>'
       +'<span>'+(r ? stars(r.stars) : '<span class="small">offen</span>')+'</span></button></li>'; }).join('')+'</ol>'
   +'<p class="small">Punkte: 10 pro Aufgabe. Ab drei fehlerfreien Aufgaben in Folge gibt es einen Serienbonus. Ein Tipp halbiert die Punkte der Aufgabe.</p>');
  const inp = $('#name'); inp.value = S.name; inp.addEventListener('input', ()=>{ S.name = inp.value.trim(); save(); });
  $('#go').onclick = () => first<0 ? licence() : startStation(first);
  view.querySelectorAll('[data-s]').forEach(b => b.onclick = () => startStation(+b.dataset.s));
}

/* ---------- Station und Aufgaben ---------- */
function startStation(i){ S.si = i; S.ti = 0; S.tasks = STATIONS[i].build(); S.cur = {base:0, pts:0, t0:Date.now()}; S.runs++; showTask(); }

const PRAISE = ['Richtig.','Stimmt.','Sauber gearbeitet.','Passt genau.','Sicher gelöst.'];
function showTask(){
  const t = S.tasks[S.ti], n = S.tasks.length; S.tip = false;
  let dots = ''; for(let k=0;k<n;k++) dots += '<i class="'+(k<S.ti?'d':k===S.ti?'c':'')+'"></i>';
  show('<section class="task"><div class="meta"><p class="eyebrow">Station '+(S.si+1)+' · '+esc(STATIONS[S.si].title)+'</p>'
   +'<div class="row"><span class="small">Aufgabe '+(S.ti+1)+' von '+n+'</span><span class="dots" aria-hidden="true">'+dots+'</span></div></div>'
   +'<h2 class="q">'+t.q+'</h2>'+(t.sub?'<p class="sub">'+t.sub+'</p>':'')
   +'<div class="media">'+(t.media||'')+'</div><div id="body"></div>'
   +(t.tip?'<div id="tipw"><button class="link" id="tipb" type="button">Tipp ansehen (halbe Punkte)</button></div>':'')
   +'<div id="fb" aria-live="polite"></div></section>');
  save();
  if(t.tip) $('#tipb').onclick = () => { S.tip = true; $('#tipw').innerHTML = '<p class="tipbox">'+t.tip+'</p>'; };
  RENDER[t.type](t, $('#body'), finish);
}
function finish(frac, exp){
  const tb = $('#tipb'); if(tb) tb.remove();
  let base = Math.round(10*frac); if(S.tip) base = Math.round(base/2);
  if(frac>=0.999) S.streak++; else S.streak = 0;
  const bonus = (frac>=0.999 && S.streak>=3) ? 2 : 0;
  S.cur.base += base; S.cur.pts += base+bonus; save(S.ti+1);
  const cls = frac>=0.999?'ok' : frac>0?'part':'bad';
  const head = frac>=0.999 ? PRAISE[Math.floor(Math.random()*PRAISE.length)] : frac>0 ? 'Teilweise richtig.' : 'Das stimmt noch nicht.';
  const last = S.ti === S.tasks.length-1;
  $('#fb').innerHTML = '<div class="fb '+cls+'"><h3>'+head+'</h3>'+(exp?'<p>'+exp+'</p>':'')
   +'<p class="pts">+'+base+' Punkte'+(bonus?' · Serienbonus +'+bonus:'')+(S.tip?' · Tipp genutzt':'')+'</p>'
   +'<div><button class="btn" id="next" type="button">'+(last?'Station abschließen':'Weiter')+'</button></div></div>';
  header();
  const nx = $('#next'); nx.onclick = () => { S.ti++; S.ti < S.tasks.length ? showTask() : endStation(); };
  nx.focus({preventScroll:true}); nx.scrollIntoView({block:'nearest', behavior:'smooth'});
}

const RENDER = {
  mc(t, body, done){
    const opts = shuffle(t.opts.map((o,i)=>({o,i})));
    body.innerHTML = '<div class="opts'+(t.grid?' grid':'')+'">'+opts.map((x,k)=>'<button type="button" class="opt" data-i="'+x.i+'"'+(t.grid?' aria-label="Auswahl '+(k+1)+'"':'')+'>'
      +(t.grid ? x.o.html+'<span class="cap" hidden>'+esc(x.o.label)+'</span>' : '<span>'+esc(x.o)+'</span>')+'</button>').join('')+'</div>';
    const bs = [...body.querySelectorAll('.opt')];
    bs.forEach(b => b.onclick = () => {
      const right = b.dataset.i === '0';
      bs.forEach(x => { x.disabled = true; if(x.dataset.i==='0') x.classList.add('ok'); const c = x.querySelector('.cap'); if(c) c.hidden = false; });
      if(!right) b.classList.add('bad');
      done(right?1:0, t.exp);
    });
  },
  multi(t, body, done){
    const opts = shuffle(t.opts);
    body.innerHTML = '<div class="opts">'+opts.map((o,i)=>'<button type="button" class="opt'+(o.ico?' ico':'')+'" aria-pressed="false" data-i="'+i+'">'+(o.ico?dev(o.ico):'')+'<span>'+esc(o.t)+'</span><span class="tag"></span></button>').join('')
      +'</div><div style="margin-top:14px"><button class="btn" id="chk" type="button" disabled>Prüfen</button></div>';
    const bs = [...body.querySelectorAll('.opt')], chk = $('#chk');
    bs.forEach(b => b.onclick = () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true'?'false':'true'); chk.disabled = !bs.some(x=>x.getAttribute('aria-pressed')==='true'); });
    chk.onclick = () => {
      let hit=0, fp=0; const nOk = opts.filter(o=>o.ok).length;
      bs.forEach((b,i) => { const sel = b.getAttribute('aria-pressed')==='true', ok = opts[i].ok; b.disabled = true; const tag = b.querySelector('.tag');
        if(sel&&ok){ hit++; b.classList.add('ok'); tag.textContent='richtig'; } else if(sel&&!ok){ fp++; b.classList.add('bad'); tag.textContent='falsch'; } else if(!sel&&ok){ b.classList.add('miss'); tag.textContent='fehlt'; } });
      chk.remove(); done(Math.max(0,(hit-fp)/nOk), t.exp);
    };
  },
  judge(t, body, done){
    let k = 0, right = 0; const n = t.items.length;
    body.innerHTML = '<p class="small" id="jc"></p><div class="card-j" id="jcard"></div><div class="two" style="margin:12px 0"><button class="btn safe" type="button" data-v="1">'+t.labels[0]+'</button><button class="btn risk" type="button" data-v="0">'+t.labels[1]+'</button></div><div class="log" id="jlog"></div>';
    const card = $('#jcard'), log = $('#jlog'), cnt = $('#jc'), bs = [...body.querySelectorAll('.two button')];

      const it = t.items[k], ok = (b.dataset.v==='1') === it.ok; if(ok) right++;
      log.insertAdjacentHTML('afterbegin','<div class="rowj '+(ok?'ok':'bad')+'"><span>'+esc(it.t)+'</span><span class="tag">'+(ok?'richtig':'falsch')+'</span><span class="rule">'+(it.ok?t.labels[0]:t.labels[1])+'. '+esc(it.rule)+'</span></div>');
      k++;
      if(k<n) draw(); else { card.remove(); cnt.remove(); body.querySelector('.two').remove(); done(right/n, right+' von '+n+' Situationen richtig beurteilt.'); }
    });
    draw();
  },
  gaps(t, body, done){
    const words = shuffle(t.gaps.concat(t.extra||[])), fill = t.gaps.map(()=>null);
    const html = esc(t.text).replace(/\{(\d)\}/g, (m,g)=>'<button type="button" class="gap" data-g="'+g+'" aria-label="Lücke '+(+g+1)+'">&nbsp;</button>');
    body.innerHTML = '<p class="gaptext">'+html+'</p><div class="bank">'+words.map((w,i)=>'<button type="button" class="chip" data-w="'+i+'">'+esc(w)+'</button>').join('')+'</div><div style="margin-top:14px"><button class="btn" id="chk" type="button" disabled>Prüfen</button></div>';
    const gaps = [...body.querySelectorAll('.gap')], chips = [...body.querySelectorAll('.chip')], chk = $('#chk');
    const draw = () => { const nx = fill.indexOf(null);
      gaps.forEach((g,i) => { g.textContent = fill[i]===null ? ' ' : words[fill[i]]; g.classList.toggle('next', i===nx); });
      chips.forEach((c,i) => c.disabled = fill.includes(i)); chk.disabled = nx !== -1; };
    chips.forEach((c,i) => c.onclick = () => { const nx = fill.indexOf(null); if(nx<0) return; fill[nx] = i; draw(); });
    gaps.forEach((g,i) => g.onclick = () => { if(fill[i]!==null){ fill[i] = null; draw(); } });
    chk.onclick = () => { let ok = 0;
      gaps.forEach((g,i) => { g.disabled = true; g.classList.remove('next'); if(words[fill[i]]===t.gaps[i]){ ok++; g.classList.add('ok'); } else { g.classList.add('bad'); g.insertAdjacentHTML('afterend','<span class="fix">'+esc(t.gaps[i])+'</span>'); } });
      body.querySelector('.bank').remove(); chk.remove(); done(ok/t.gaps.length, t.exp); };
    draw();
  },
  order(t, body, done){
    const n = t.items.length; let disp = shuffle(t.items.map((x,i)=>i)); if(disp.every((v,i)=>v===i)) disp.reverse();
    let seq = [];
    body.innerHTML = '<div class="ord">'+disp.map(i=>'<button type="button" data-i="'+i+'"><span class="n"></span><span>'+esc(t.items[i])+'</span></button>').join('')+'</div><div style="margin-top:14px"><button class="btn" id="chk" type="button" disabled>Prüfen</button></div>';
    const bs = [...body.querySelectorAll('.ord button')], chk = $('#chk');
    const draw = () => { bs.forEach(b => { const p = seq.indexOf(+b.dataset.i); b.classList.toggle('set', p>=0); b.querySelector('.n').textContent = p>=0 ? p+1 : ''; }); chk.disabled = seq.length<n; };
    bs.forEach(b => b.onclick = () => { const i = +b.dataset.i, p = seq.indexOf(i); if(p>=0) seq.splice(p,1); else seq.push(i); draw(); });
    chk.onclick = () => { let ok = 0; const wrap = body.querySelector('.ord');
      bs.slice().sort((a,b)=>a.dataset.i-b.dataset.i).forEach(b => { const i = +b.dataset.i, good = seq[i]===i; if(good) ok++; b.disabled = true; b.classList.remove('set'); b.classList.add(good?'ok':'bad'); b.querySelector('.n').textContent = i+1; wrap.appendChild(b); });
      chk.remove(); done(ok/n, (ok<n?'Oben siehst du die richtige Reihenfolge. ':'')+t.exp); };
    draw();
  },
  match(t, body, done){
    const n = t.pairs.length, right = shuffle(t.pairs.map((p,i)=>i)); let sel = null, got = 0, err = 0;
    body.innerHTML = '<div class="match"><div>'+t.pairs.map((p,i)=>'<button type="button" class="m'+(t.num?' num':'')+'" data-l="'+i+'" aria-pressed="false">'+p.l+'</button>').join('')+'</div><div>'
      +right.map(i=>'<button type="button" class="m" data-r="'+i+'">'+esc(t.pairs[i].r)+'</button>').join('')+'</div></div><p class="small" id="mh" style="margin-top:10px">Noch '+n+' Paare.</p>';
    const L = [...body.querySelectorAll('[data-l]')], R = [...body.querySelectorAll('[data-r]')], hint = $('#mh');
    L.forEach(b => b.onclick = () => { L.forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); sel = b; });
    R.forEach(b => b.onclick = () => {
      if(!sel){ hint.textContent = 'Wähle zuerst links etwas aus.'; return; }
      if(sel.dataset.l === b.dataset.r){ [sel,b].forEach(x=>{ x.classList.add('ok'); x.disabled = true; x.setAttribute('aria-pressed','false'); }); sel = null; got++;
        hint.textContent = got<n ? 'Noch '+(n-got)+' Paare. Fehlversuche: '+err : '';
        if(got===n) done(Math.max(0,1-err/n), (err ? err+(err===1?' Fehlversuch. ':' Fehlversuche. ') : '')+t.exp);
      } else { err++; const a = sel; [a,b].forEach(x=>x.classList.add('bad')); setTimeout(()=>[a,b].forEach(x=>x.classList.remove('bad')), 600); hint.textContent = 'Das passt nicht zusammen. Fehlversuche: '+err; }
    });
  },
  sort2(t, body, done){
    const n = t.items.length, val = t.items.map(()=>null);
    body.innerHTML = '<div class="sort2">'+t.items.map((it,i)=>'<div class="s2" data-i="'+i+'"><span>'+esc(it.t)+'</span><div class="seg"><button type="button" data-v="0" aria-pressed="false">'+t.labels[0]+'</button><button type="button" data-v="1" aria-pressed="false">'+t.labels[1]+'</button></div></div>').join('')
      +'</div><div style="margin-top:14px"><button class="btn" id="chk" type="button" disabled>Prüfen</button></div>';

      rows.forEach((r,i) => { const good = val[i]===t.items[i].side; if(good) ok++; r.classList.add(good?'ok':'bad'); r.querySelectorAll('button').forEach(b=>b.disabled = true);
        if(!good) r.querySelector('span').insertAdjacentHTML('beforeend',' <b>→ '+t.labels[t.items[i].side]+'</b>'); });
      chk.remove(); done(ok/n, t.exp); };
  },
  hotspot(t, body, done){
    const spots = [...document.querySelectorAll('.media .spot')];
    if(t.choices) body.innerHTML = '<div class="opts">'+t.choices.map(c=>'<button type="button" class="opt" data-c="'+c[0]+'"><b>'+c[1]+'</b><span>'+c[2]+'</span></button>').join('')+'</div>';
    const bs = [...body.querySelectorAll('.opt')]; let over = false;
    const choose = k => { if(over) return; over = true; const right = k===t.a;
      spots.forEach(x => { x.classList.add('off'); x.removeAttribute('tabindex'); if(x.dataset.spot===t.a) x.classList.add('ok'); else if(x.dataset.spot===k) x.classList.add('bad'); });
      bs.forEach(b => { b.disabled = true; if(b.dataset.c===t.a) b.classList.add('ok'); else if(b.dataset.c===k) b.classList.add('bad'); });
      done(right?1:0, t.exp); };
    spots.forEach(s => { s.addEventListener('click', ()=>choose(s.dataset.spot)); s.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); choose(s.dataset.spot); } }); });
    bs.forEach(b => b.onclick = () => choose(b.dataset.c));
  },
  num(t, body, done){
    body.innerHTML = '<form class="num" id="nf"><label for="numin" class="small">Dein Wert</label><input id="numin" type="text" inputmode="decimal" autocomplete="off"><span class="unit">'+t.unit+'</span><button class="btn" type="submit">Prüfen</button></form><p class="small" id="nh"></p>';
    const f = $('#nf'), inp = $('#numin');
    f.addEventListener('submit', e => { e.preventDefault();
      const x = parseFloat(inp.value.replace(',','.').replace(/[^0-9.\-]/g,''));

      inp.style.borderColor = right ? 'var(--ok)' : 'var(--bad)'; done(right?1:0, t.fb ? t.fb(x) : t.exp); });
  }
};

/* ---------- Stationsende ---------- */
function endStation(){
  const i = S.si, max = S.tasks.length*10, pct = Math.round(100*S.cur.base/max), st = starsFor(pct);
  const r = {pct, pts:S.cur.pts, stars:st, sec:Math.round((Date.now()-S.cur.t0)/1000)};
  const old = S.results[i], better = !old || pct >= old.pct;
  if(better) S.results[i] = r; S.cur = null; save();
  const got = pct>=60, nx = nextOpen(i);
  show('<section class="result"><p class="eyebrow">Station '+(i+1)+' · '+esc(STATIONS[i].title)+'</p>'
   +(got ? '<div class="stamp"><span>Station '+(i+1)+'</span><strong>Geprüft</strong><span>Chemie 8</span></div>' : '<div class="stamp none"><span>Station '+(i+1)+'</span><strong>offen</strong><span>ab 60 %</span></div>')
   +'<div class="row"><span class="big">'+pct+' %</span>'+stars(st)+'</div>'
   +'<p>'+(pct>=90 ? 'Starke Leistung. Diese Station sitzt.' : got ? 'Stempel geholt. Mit einem zweiten Durchgang sind mehr Sterne drin.' : 'Für den Stempel brauchst du 60 %. Lies die Erklärungen beim zweiten Durchgang genau, dann klappt es.')+'</p>'
   +(old && !better ? '<p class="small">Dein bestes Ergebnis hier bleibt bei '+old.pct+' %.</p>' : '')
   +'<p class="small">'+esc(STATIONS[i].can)+'</p>'
   +'<div class="row">'+(!got ? '<button class="btn" id="a1" type="button">Station wiederholen</button>' : nx>=0 ? '<button class="btn" id="a1" type="button">Weiter zu Station '+(nx+1)+'</button>' : '<button class="btn" id="a1" type="button">Führerschein ansehen</button>')
   +(got ? '<button class="btn ghost" id="a2" type="button">Noch einmal üben</button>' : '')+'<button class="link" id="a3" type="button">Zur Übersicht</button></div></section>');
  $('#a1').onclick = () => !got ? startStation(i) : nx>=0 ? startStation(nx) : licence();
  const a2 = $('#a2'); if(a2) a2.onclick = () => startStation(i);
  $('#a3').onclick = home;
}
